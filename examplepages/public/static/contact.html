<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Aura</title>
    <meta name="description"
        content="Reach out to Aura for your next digital project. We're here to bring your vision to life.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav>
        <div class="logo">AURA</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact" class="active">Contact</a></li>
        </ul>
        <a href="/contact" class="btn btn-primary" style="padding: 0.6rem 1.5rem;">Start Now</a>
    </nav>

    <main class="section">
        <div style="text-align: center; margin-bottom: 4rem;">
            <h2 style="font-size: 3.5rem; margin-bottom: 1rem;">Let's Connect</h2>
            <p style="color: var(--text-muted);">Have a vision? We have the tools to make it a reality.</p>
        </div>

        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Tell us about your project..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
        </form>
    </main>

    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thank you for reaching out! We will get back to you soon.');
            e.target.reset();
        });
    </script>

    <footer>
        <p>&copy; 2026 AURA Inc. All rights reserved.</p>
    </footer>
</body>

</html>
